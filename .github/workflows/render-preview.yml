name: render preview

# Renders a preview MP4 on a GitHub runner (software GL: about 0.5 s per frame, so a section takes a
# few minutes and the whole song about an hour at 30 fps). Download it from the run's artifacts.
on:
  workflow_dispatch:
    inputs:
      segment:
        description: Section to render
        required: true
        default: opening
        type: choice
        options:
          - opening      # verse 1 and pre-chorus 1 (0:00-0:48)
          - chorus1      # pre-chorus 1, chorus 1 and the post-chorus
          - verse2       # verse 2 and pre-chorus 2
          - chorus2
          - bridge-build # bridge, build and stop
          - chorus3
          - outro
          - full
      fps:
        description: Frames per second
        required: true
        default: '30'
        type: choice
        options: ['30', '60']

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Browser and ffmpeg
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Resolve segment
        id: seg
        run: |
          # times in song seconds, from data/audio.json sections
          range=$(python3 - "${{ inputs.segment }}" <<'PY'
          import json, sys
          a = json.load(open('../data/audio.json')); s = {x['name']: x for x in a['sections']}
          R = {'opening': ('verse1', 'pre1'), 'chorus1': ('pre1', 'post1'), 'verse2': ('verse2', 'pre2'), 'chorus2': ('chorus2', 'chorus2'),
               'bridge-build': ('bridge', 'stop'), 'chorus3': ('chorus3', 'chorus3'), 'outro': ('outro', 'outro')}
          seg = sys.argv[1]
          if seg == 'full': print(0, a['duration'])
          else: a0, a1 = R[seg]; print(round(s[a0]['start'], 3), round(s[a1]['end'], 3))
          PY
          )
          echo "from=${range% *}" >> "$GITHUB_OUTPUT"; echo "to=${range#* }" >> "$GITHUB_OUTPUT"
          echo "rendering ${{ inputs.segment }}: $range"
      - name: Render
        run: bun scripts/render.ts video --from ${{ steps.seg.outputs.from }} --to ${{ steps.seg.outputs.to }} --fps ${{ inputs.fps }} --crf 23 --preset veryfast --out ../out/p-of-us-${{ inputs.segment }}.mp4
      - uses: actions/upload-artifact@v6
        with:
          name: p-of-us-${{ inputs.segment }}
          path: out/p-of-us-${{ inputs.segment }}.mp4
          retention-days: 14
