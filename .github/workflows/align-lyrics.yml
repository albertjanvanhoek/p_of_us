name: align lyrics

# Word-level lyric timing on a GitHub runner (the model hosts are reachable there).
# Ported from the Honesty-video pipeline: Demucs vocal stem -> faster-whisper word timestamps
# -> match to lyrics/lyrics_sheet.json -> commit data/lyrics.json to the triggering branch.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Whisper model (small.en is fast; medium.en hears sung words better)
        default: medium.en
        type: choice
        options:
          - small.en
          - medium.en
          - large-v3
      separate:
        description: Separate the vocals from the music first (recommended)
        default: true
        type: boolean
      force:
        description: Commit the new timings even if they match fewer words than the committed ones
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/align-lyrics.yml'
      - 'analysis/align_whisper.py'
      - 'lyrics/lyrics_sheet.json'
      - 'audio/p-of-us.mp3'

permissions:
  contents: write

concurrency:
  group: align-lyrics-${{ github.ref }}
  cancel-in-progress: true

env:
  SONG: audio/p-of-us.mp3
  # a push has no inputs: use the same defaults as a manual run
  MODEL: ${{ inputs.model || 'medium.en' }}
  SEPARATE: ${{ github.event_name == 'push' || inputs.separate }}
  FORCE: ${{ inputs.force || false }}
  BRANCH: ${{ github.ref_name }}

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the song is present
        id: song
        run: |
          if [ -f "$SONG" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          msg="$SONG is not in the repository; the aligner needs it (see README, Lyric timing)."
          if [ "${{ github.event_name }}" = "push" ]; then echo "::notice::$msg Skipping."; else echo "::error::$msg"; exit 1; fi

      - uses: actions/setup-python@v5
        if: steps.song.outputs.ok == 'true'
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        if: steps.song.outputs.ok == 'true'
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: align-models-${{ env.MODEL }}-htdemucs

      - name: Install aligner
        if: steps.song.outputs.ok == 'true'
        run: pip install faster-whisper==1.1.1 requests

      - name: Install vocal separation (Demucs, CPU)
        if: steps.song.outputs.ok == 'true' && env.SEPARATE == 'true'
        run: |
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install demucs==4.0.1 soundfile

      - name: Separate vocals
        if: steps.song.outputs.ok == 'true' && env.SEPARATE == 'true'
        run: |
          python -m demucs --two-stems=vocals -n htdemucs -o sep "$SONG"
          ls -la "sep/htdemucs/$(basename "$SONG" .mp3)"

      - name: Align known lyrics to recording
        if: steps.song.outputs.ok == 'true'
        run: |
          AUDIO="$SONG"; FLAG=""
          if [ "$SEPARATE" = "true" ]; then AUDIO="sep/htdemucs/$(basename "$SONG" .mp3)/vocals.wav"; FLAG="--separated"; fi
          python analysis/align_whisper.py \
            --audio "$AUDIO" \
            --sheet lyrics/lyrics_sheet.json \
            --out data/lyrics.json \
            --model "$MODEL" $FLAG

      - name: Keep the committed timings if this run is worse
        if: steps.song.outputs.ok == 'true'
        run: |
          git show HEAD:data/lyrics.json > /tmp/committed-lyrics.json 2>/dev/null || : > /tmp/committed-lyrics.json
          FLAG=""; if [ "$FORCE" = "true" ]; then FLAG="--force"; fi
          python analysis/keep_better_alignment.py --old /tmp/committed-lyrics.json --new data/lyrics.json $FLAG | tee /tmp/guard.txt
          if [ "$(tail -n1 /tmp/guard.txt)" = "keep" ]; then
            echo "::notice::$(tail -n2 /tmp/guard.txt | head -n1)"
          fi

      - name: Re-derive the sections from the timings
        if: steps.song.outputs.ok == 'true'
        working-directory: analysis
        run: python 7_sections_from_lyrics.py

      - name: Commit aligned timing
        if: steps.song.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lyrics.json data/audio.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Align lyrics with Whisper ($MODEL, vocals separated: $SEPARATE)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "Push attempt $attempt failed; rebasing on origin/$BRANCH and retrying..."
            sleep 3
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { git rebase --abort; exit 1; }
          done
          exit 1
